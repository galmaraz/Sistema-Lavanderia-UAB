<form action="/" method="POST">
    <div class="mb-4">
        <label for="correo" class="block text-gray-700">Correo</label>
        <input type="email" id="correo" name="correo" class="w-full p-2 border border-gray-300 rounded-md" required>
    </div>
    <div class="mb-4">
        <label for="contrasena" class="block text-gray-700">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" class="w-full p-2 border border-gray-300 rounded-md" required>
    </div>
    <div class="mb-4">
        <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded-md">Iniciar sesión</button>
    </div>
</form>

<p>No tienes cuenta? <a href="/usuarios" class="text-blue-500">Regístrate aquí</a></p>
