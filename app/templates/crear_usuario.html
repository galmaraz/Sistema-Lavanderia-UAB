
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>

</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded shadow-lg">
        <h2 class="text-2xl font-bold mb-4 text-center">Crear Usuario</h2>
        <form id="formulario" class="space-y-4">
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="w-full p-2 border border-gray-300 rounded" required>
            </div>
            
            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700">Correo Institucional</label>
                <input type="email" id="correo" name="correo" class="w-full p-2 border border-gray-300 rounded" required>
                <span id="error-correo" class="text-red-500 text-sm hidden"></span>
            </div>
            
            <div>
                <label for="contrasena" class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" class="w-full p-2 border border-gray-300 rounded" required>
                <span id="error-contrasena" class="text-red-500 text-sm hidden"></span>
            </div>
            
            <div>
                <label for="tipo_usuario" class="block text-sm font-medium text-gray-700">Tipo de Usuario</label>
                <select id="tipo_usuario" name="tipo_usuario" class="w-full p-2 border border-gray-300 rounded" required>
                    <option value="">Seleccionar...</option>
                    <option value="administrador">Administrador</option>
                    <option value="estudiante interno">Estudiante Interno</option>
                </select>
            </div>
            
            <div class="flex justify-center">
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">Crear Usuario</button>
            </div>
        </form>

        <div id="mensaje" class="mt-4 text-center text-sm text-gray-600 hidden"></div>
    </div>

    <script src="../static/js/formulario.js"></script>
</body>
</html>
